name: Cloudflare Scanner Deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cloudflare-deploy.yml', 'cloudflare/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-scanner-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing Python scanner tests
        run: python3 -m unittest discover -v
      - name: Verify separate Worker filters
        run: node --test cloudflare/worker.test.mjs
      - name: Deploy Worker and prove Telegram delivery and scheduled invocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 cloudflare/deploy.py
