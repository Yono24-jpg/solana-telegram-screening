name: Deploy Cloudflare momentum scanner
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-momentum-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Python screening regression tests
        run: python3 -m unittest -v
      - name: Run Cloudflare Worker tests
        run: node --test cloudflare/*.test.mjs
      - name: Deploy and verify the always-on Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          DEXPAPRIKA_API_KEY: ${{ secrets.DEXPAPRIKA_API_KEY }}
          DEXFUN_API_KEY: ${{ secrets.DEXFUN_API_KEY }}
        run: python3 cloudflare/deploy.py
