name: Solana Telegram Screening
on:
  push:
    branches: [main]
    paths: ['scanner_v5.py', 'smart_discovery.py', 'data_intelligence.py', 'birdeye_standard.py', 'global_intelligence.py', 'social_intelligence.py', 'hunter_modes.py', 'hunter_memory.py', 'token_extensions.py', 'discovery_watchlist.json', 'narrative_v3.py', 'security_v3.py', 'bot.py', 'scanner_v2.py', 'market_data.py', 'vault_checks.py', 'screening_rules.py', 'evidence.py', 'state_store.py', 'persist_state.py', 'signal_quality.py', 'test*.py', '.github/workflows/screen.yml']
  workflow_dispatch:
  schedule:
    # Explicit five-minute slots away from the beginning of each hour (UTC).
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
  id-token: write
concurrency:
  group: solana-screening
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify original and upgraded filters
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: python3 -m unittest -vb
      - name: Refresh durable state
        run: |
          git fetch origin main
          git show origin/main:state.json > /tmp/latest-screening-state.json
          python3 -m json.tool /tmp/latest-screening-state.json > /dev/null
          cp /tmp/latest-screening-state.json state.json
      - name: Scan and process Telegram controls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          RUGCHECK_BEARER_TOKEN: ${{ secrets.RUGCHECK_BEARER_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_READS_ENABLED: '0'
          SCANNER_WATCHLIST_FILE: /tmp/no-manual-token-seeds.json
          PYTHONUNBUFFERED: '1'
        run: |
          python3 bot.py
          python3 persist_state.py
      - name: Persist even after a failed cycle
        if: always()
        run: python3 persist_state.py
      - name: Save observed scan and performance reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scanner-v5-report-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
