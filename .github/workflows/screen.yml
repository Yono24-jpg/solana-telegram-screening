name: Solana Telegram Screening
# Run to process the latest Telegram ON/OFF callback.
on:
  push:
    paths: ['bot.py', 'test_bot.py', '.github/workflows/screen.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-screening
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show trigger and UTC time
        run: echo "TRIGGER=${{ github.event_name }} UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Verify fail-closed filters
        run: python3 -m unittest -v
      - name: Scan and process Telegram controls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          for scan in 1 2 3 4; do
            echo "SCAN_CYCLE=$scan UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 bot.py || exit 1
            if [ "$scan" -lt 4 ]; then sleep 60; fi
          done
      - name: Persist control and delivery state
        if: always()
        run: |
          if [ ! -f state.json ]; then exit 0; fi
          cp state.json /tmp/scan-state.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          local=json.loads(Path('/tmp/scan-state.json').read_text())
          try:
              remote=json.loads(subprocess.check_output(['git','show','origin/main:state.json'],text=True))
          except (subprocess.CalledProcessError,ValueError):
              remote={}
          merged=dict(remote)
          merged['sent']={**local.get('sent',{}),**remote.get('sent',{})}
          merged['offset']=max(local.get('offset',0),remote.get('offset',0))
          merged['initialized']=bool(local.get('initialized') or remote.get('initialized'))
          # The most recent callback processed by the scan takes precedence.
          merged['enabled']=local.get('enabled',remote.get('enabled',False)) if local.get('offset',0)>remote.get('offset',0) else remote.get('enabled',local.get('enabled',False))
          Path('/tmp/merged-state.json').write_text(json.dumps(merged,sort_keys=True))
          PY
            git reset --hard origin/main
            cp /tmp/merged-state.json state.json
            git add state.json
            if git diff --cached --quiet; then exit 0; fi
            git -c user.name=solana-screening-bot -c user.email=solana-screening-bot@users.noreply.github.com commit -m 'Persist screening control and delivery state'
            if git push origin HEAD:main; then exit 0; fi
            echo "State push race; retry $attempt"
          done
          echo "STATE_PERSIST_FAILED after retries"
          exit 1
