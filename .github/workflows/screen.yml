name: Solana Telegram Screening
# Run to process the latest Telegram ON/OFF callback.
on:
  push:
    paths: ['bot.py', 'test_bot.py', '.github/workflows/screen.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-screening
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Show trigger and UTC time
        run: echo "TRIGGER=${{ github.event_name }} UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Verify fail-closed filters
        run: python3 -m unittest -v
      - name: Scan and process Telegram controls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          for scan in 1 2 3 4; do
            echo "SCAN_CYCLE=$scan UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 bot.py || exit 1
            if [ "$scan" -lt 4 ]; then sleep 60; fi
          done
      - name: Persist control and delivery state
        if: always()
        run: |
          if [ -f state.json ]; then
            git config user.name 'solana-screening-bot'
            git config user.email 'solana-screening-bot@users.noreply.github.com'
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m 'Persist screening control and delivery state'
              git pull --rebase origin main
              git push
            fi
          fi
