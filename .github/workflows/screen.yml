name: Solana Telegram Screening
on:
  push:
    branches: [main]
    paths: ['bot.py', 'scanner_v2.py', 'screening_rules.py', 'evidence.py', 'state_store.py', 'persist_state.py', 'signal_quality.py', 'test*.py', '.github/workflows/screen.yml']
  workflow_dispatch:
  schedule:
    - cron: '3-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-screening
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original and upgraded filters
        run: python3 -m unittest -v
      - name: Refresh durable state
        run: |
          git fetch origin main
          git show origin/main:state.json > /tmp/latest-screening-state.json
          python3 -m json.tool /tmp/latest-screening-state.json > /dev/null
          cp /tmp/latest-screening-state.json state.json
      - name: Scan and process Telegram controls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_READS_ENABLED: ${{ vars.X_READS_ENABLED }}
          PYTHONUNBUFFERED: '1'
        run: |
          failed=0
          for scan in 1 2 3; do
            echo "SCAN_CYCLE=$scan"
            python3 bot.py || failed=1
            python3 persist_state.py || exit 1
            if [ "$scan" -lt 3 ]; then sleep 30; fi
          done
          exit "$failed"
      - name: Persist even after a failed cycle
        if: always()
        run: python3 persist_state.py
      - name: Save observed scan and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-v2-report-${{ github.run_id }}
          path: reports/*.json
          if-no-files-found: ignore
          retention-days: 14
