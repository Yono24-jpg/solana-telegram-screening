name: Scanner Schedule Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '13,43 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: scanner-schedule-watchdog
  cancel-in-progress: false
jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch existing scanner only if no recent run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime as dt, json, os, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                     'Accept':'application/vnd.github+json',
                     'X-GitHub-Api-Version':'2022-11-28'}
          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(root+path, method=method, data=data,
                                           headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as response:
                  raw=response.read()
                  return response.status, json.loads(raw) if raw else {}
          status, workflow = request('GET','/actions/workflows/screen.yml')
          if status != 200 or workflow.get('path') != '.github/workflows/screen.yml':
              raise SystemExit('Scanner workflow identity check failed')
          if workflow.get('state') != 'active':
              raise SystemExit('Scanner workflow disabled; manual investigation required')
          _, result = request('GET','/actions/workflows/screen.yml/runs?branch=main&per_page=10')
          runs = result.get('workflow_runs', [])
          if not isinstance(runs,list): raise SystemExit('Invalid workflow run response')
          now = dt.datetime.now(dt.timezone.utc)
          for run in runs:
              if run.get('status') in ('queued','in_progress','waiting','requested','pending'):
                  print('WATCHDOG skip: scanner already running or queued',run.get('id'))
                  raise SystemExit(0)
              started = run.get('run_started_at') or run.get('created_at')
              if started:
                  timestamp=dt.datetime.fromisoformat(started.replace('Z','+00:00'))
                  if (now-timestamp).total_seconds() < 15*60:
                      print('WATCHDOG skip: recent scanner run',run.get('id'),run.get('event'))
                      raise SystemExit(0)
          code,_=request('POST','/actions/workflows/screen.yml/dispatches',{'ref':'main'})
          if code!=204: raise SystemExit('Recovery dispatch not accepted')
          print('WATCHDOG recovery dispatched; this does not prove schedule reliability')
          PY
