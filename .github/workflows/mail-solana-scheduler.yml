name: MAIL Solana Scheduler
on:
  push:
    branches: [main, 'setup/mail-solana-scheduler-20261109']
    paths: ['scheduler/**', '.github/workflows/mail-solana-scheduler.yml']
  pull_request:
    paths: ['scheduler/**', '.github/workflows/mail-solana-scheduler.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mail-solana-scheduler-deploy
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned local verification tools
        working-directory: scheduler
        run: npm ci --no-audit --no-fund
      - name: Verify scheduler and original scanner
        run: |
          node --test scheduler/test/*.test.mjs
          python3 -m unittest discover -vb
          python3 -m py_compile scheduler/deploy.py
      - name: Validate Worker bundle without deployment
        working-directory: scheduler
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --no-install wrangler deploy --dry-run --outdir /tmp/mail-scheduler-bundle
  deploy-or-audit:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Audit stored access or deploy the separate scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            python3 scheduler/deploy.py deploy
          else
            python3 scheduler/deploy.py audit
          fi
      - name: Save safe deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-scheduler-${{ github.run_id }}
          path: scheduler/reports/*.json
          if-no-files-found: ignore
          retention-days: 14
